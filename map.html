<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Выбор локации</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    html, body { height: 100%; margin: 0; font-family: Segoe UI, Arial, sans-serif; }
    #top { display: flex; gap: 12px; align-items: center; padding: 10px 12px; background: #f3f4f6; border-bottom: 1px solid #e5e7eb; }
    #status { color: #374151; font-size: 13px; }
    #map { height: calc(100% - 52px); }
    button { background: #2563eb; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div id="top">
    <button id="save">Сохранить координаты</button>
    <div id="status">Кликните по карте, затем сохраните.</div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const initialLat = {{LAT}};
    const initialLon = {{LON}};

    const map = L.map('map').setView([initialLat, initialLon], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let marker = L.marker([initialLat, initialLon]).addTo(map);
    const statusEl = document.getElementById('status');

    function setMarker(lat, lon) {
      marker.setLatLng([lat, lon]);
      statusEl.textContent = `Выбрано: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    }

    map.on('click', (e) => {
      setMarker(e.latlng.lat, e.latlng.lng);
    });

    document.getElementById('save').addEventListener('click', async () => {
      const pos = marker.getLatLng();
      if (window.pywebview && window.pywebview.api && window.pywebview.api.set_location) {
        const res = await window.pywebview.api.set_location(pos.lat, pos.lng);
        if (res && res.message) {
          statusEl.textContent = res.message;
        } else {
          statusEl.textContent = 'Сохранено.';
        }
      } else {
        statusEl.textContent = 'API недоступен. Откройте окно через приложение.';
      }
    });
  </script>
</body>
</html>
